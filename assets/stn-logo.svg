<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 120" width="100%" height="100%">
  <defs>
    <linearGradient id="stnGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF2B2" />
      <stop offset="30%" stop-color="#E5B869" />
      <stop offset="70%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#9A7B1C" />
    </linearGradient>
    <linearGradient id="spnGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF2B2" />
      <stop offset="30%" stop-color="#E5B869" />
      <stop offset="70%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#9A7B1C" />
    </linearGradient>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="badgeShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Group: Brand Emblem (Canada Flag + STN + Truck) -->
  <g transform="translate(10, 15)">
    <!-- Canada Flag Badge -->
    <g transform="translate(0, 18)" filter="url(#badgeShadow)">
      <rect x="0" y="0" width="60" height="36" rx="4" fill="#FFFFFF" stroke="url(#stnGoldGrad)" stroke-width="1.8"/>
      <rect x="0" y="0" width="15" height="36" rx="3" fill="#D80027"/>
      <rect x="45" y="0" width="15" height="36" rx="3" fill="#D80027"/>
      <!-- Official 11-point Canadian Red Maple Leaf -->
      <g transform="translate(15, 0)">
        <g transform="translate(15, 18) scale(0.068) translate(-320, -240)">
          <path fill="#D52B1E" d="M201 232l-13.3 4.4 61.4 54c4.7 13.7-1.6 17.8-5.6 25l66.6-8.4-1.6 67 13.9-.3-3.1-66.6 66.7 8c-4.1-8.7-7.8-13.3-4-27.2l61.3-51-10.7-4c-8.8-6.8 3.8-32.6 5.6-48.9 0 0-35.7 12.3-38 5.8l-9.2-17.5-32.6 35.8c-3.5.9-5-.5-5.9-3.5l15-74.8-23.8 13.4q-3.2 1.3-5.2-2.2l-23-46-23.6 47.8q-2.8 2.5-5 .7L264 130.8l13.7 74.1c-1.1 3-3.7 3.8-6.7 2.2l-31.2-35.3c-4 6.5-6.8 17.1-12.2 19.5s-23.5-4.5-35.6-7c4.2 14.8 17 39.6 9 47.7"/>
        </g>
      </g>
    </g>

    <!-- STN Monogram -->
    <g transform="translate(76, 0)">
      <!-- S -->
      <path d="M 50 18 C 50 8 40 2 26 2 C 10 2 2 10 2 22 C 2 35 14 40 30 44 C 44 47 48 52 48 60 C 48 70 38 76 24 76 C 8 76 0 66 0 54 L 14 54 C 14 62 20 66 25 66 C 32 66 36 62 36 57 C 36 48 24 44 10 40 C 0 37 -2 29 -2 20 C -2 8 8 0 26 0 C 44 0 52 10 52 18 Z" fill="url(#stnGoldGrad)" filter="url(#subtleGlow)" />
      
      <!-- T -->
      <path d="M 64 0 L 118 0 L 118 14 L 98 14 L 98 76 L 84 76 L 84 14 L 64 14 Z" fill="url(#stnGoldGrad)" filter="url(#subtleGlow)" />
      
      <!-- N -->
      <path d="M 130 0 L 146 0 L 180 54 L 180 0 L 193 0 L 193 76 L 177 76 L 143 22 L 143 76 L 130 76 Z" fill="url(#stnGoldGrad)" filter="url(#subtleGlow)" />

      <!-- Stylized Semi Truck Silhouette Icon next to STN -->
      <g transform="translate(216, 8)">
        <rect x="0" y="8" width="55" height="38" rx="3" fill="none" stroke="url(#stnGoldGrad)" stroke-width="2.5" />
        <line x1="12" y1="8" x2="12" y2="46" stroke="rgba(212,175,55,0.4)" stroke-width="1.5" />
        <path d="M 55 22 L 72 22 L 84 32 L 88 46 L 55 46 Z" fill="none" stroke="url(#stnGoldGrad)" stroke-width="2.5" />
        <path d="M 68 25 L 78 33 L 68 33 Z" fill="url(#stnGoldGrad)" opacity="0.8" />
        <rect x="85" y="38" width="5" height="8" rx="1" fill="url(#stnGoldGrad)" />
        <circle cx="12" cy="48" r="6" fill="#0B1329" stroke="url(#stnGoldGrad)" stroke-width="2.5" />
        <circle cx="12" cy="48" r="2.5" fill="url(#stnGoldGrad)" />
        <circle cx="44" cy="48" r="6" fill="#0B1329" stroke="url(#stnGoldGrad)" stroke-width="2.5" />
        <circle cx="44" cy="48" r="2.5" fill="url(#stnGoldGrad)" />
        <circle cx="76" cy="48" r="6" fill="#0B1329" stroke="url(#stnGoldGrad)" stroke-width="2.5" />
        <circle cx="76" cy="48" r="2.5" fill="url(#stnGoldGrad)" />
        <line x1="-12" y1="20" x2="-4" y2="20" stroke="url(#stnGoldGrad)" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
        <line x1="-16" y1="28" x2="-4" y2="28" stroke="url(#stnGoldGrad)" stroke-width="2" stroke-linecap="round" opacity="0.9"/>
        <line x1="-10" y1="36" x2="-4" y2="36" stroke="url(#stnGoldGrad)" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
      </g>
    </g>
  </g>

  <!-- Wordmark Line: TRUCKING LTD. -->
  <g transform="translate(14, 98)">
    <line x1="0" y1="-3" x2="35" y2="-3" stroke="url(#stnGoldGrad)" stroke-width="2" />
    <text x="45" y="0" font-family="'Inter', 'Montserrat', 'Segoe UI', Arial, sans-serif" font-size="19" font-weight="800" fill="#FFFFFF" letter-spacing="0.28em">TRUCKING <tspan fill="url(#stnGoldGrad)">LTD.</tspan></text>
    <line x1="262" y1="-3" x2="385" y2="-3" stroke="url(#stnGoldGrad)" stroke-width="2" />
  </g>

  <!-- Subtitle Tagline & BC Locations -->
  <g transform="translate(14, 115)">
    <text x="0" y="0" font-family="'Inter', 'Segoe UI', Arial, sans-serif" font-size="8.5" font-weight="700" fill="#94A3B8" letter-spacing="0.14em">SURREY &amp; VANCOUVER, BC <tspan fill="#D4AF37">•</tspan> LOWER MAINLAND <tspan fill="#D4AF37">•</tspan> CANADA</text>
  </g>
</svg>
